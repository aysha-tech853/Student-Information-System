<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Management - Alpine College of Education</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="navbar">
    <div class="nav-brand">Alpine College of Education</div>
    <button onclick="logout()" class="btn btn-secondary">Logout</button>
  </div>

  <div class="main-container">
    <aside class="sidebar">
      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-item">Dashboard</a>
        <a href="courses.html" class="nav-item active">Course Management</a>
        <a href="subjects.html" class="nav-item">Subject Management</a>
        <a href="students.html" class="nav-item">Student Management</a>
        <a href="marks.html" class="nav-item">Marks Management</a>
        <a href="attendance.html" class="nav-item">Attendance Management</a>
        <a href="reports.html" class="nav-item">Reports</a>
      </nav>
    </aside>

    <main class="content">
      <h1>Course Management</h1>

      <div class="action-header">
        <button onclick="showAddForm()" class="btn btn-primary">
          Add New Course
        </button>
      </div>

      <div id="courseForm" class="form-card" style="display: none;">
        <h2 id="formTitle">Add New Course</h2>

        <form id="addCourseForm" onsubmit="return handleCourseSubmit(event)">
          <input type="hidden" id="courseId" name="courseId" />

          <div class="form-group">
            <label for="courseCode">Course Code *</label>
            <input type="text" id="courseCode" name="courseCode" required />
          </div>

          <div class="form-group">
            <label for="courseName">Course Name *</label>
            <input type="text" id="courseName" name="courseName" required />
          </div>

          <div class="form-group">
            <label for="duration">Duration (Years) *</label>
            <select id="duration" name="duration" required>
              <option value="">Select Duration</option>
              <option value="1">1 Year</option>
              <option value="2">2 Years</option>
              <option value="3">3 Years</option>
              <option value="4">4 Years</option>
            </select>
          </div>

          <div class="form-group">
            <label for="department">Department *</label>
            <input type="text" id="department" name="department" required />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Course</button>
            <button type="button" onclick="cancelForm()" class="btn btn-secondary">
              Cancel
            </button>
          </div>
        </form>
      </div>

      <div class="table-container">
        <h2>Courses List</h2>
        <table id="coursesTable">
          <thead>
            <tr>
              <th>Course Code</th>
              <th>Course Name</th>
              <th>Duration</th>
              <th>Department</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="coursesTableBody">
            <tr>
              <td colspan="5" class="no-data">
                No courses available. Add a new course to get started.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="auth.js"></script>
  <script src="courses.js"></script>
</body>
</html>
